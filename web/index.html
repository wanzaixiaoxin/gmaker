<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/long@5.2.3/umd/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.3.2/dist/protobuf.min.js"></script>
    <script>
        if (window.Long && window.protobuf) {
            protobuf.util.Long = window.Long;
            protobuf.configure();
        }
    </script>
    <!-- protobuf descriptor：由 scripts/gen-proto-json.js 从 spec/proto/*.proto 自动生成，勿手改 -->
    <script src="js/proto_descriptor.js"></script>
    <script>
    if (!window.PROTO_DESCRIPTOR) {
        console.error('proto_descriptor.js 未加载，protobuf 功能不可用');
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/lossless-json@2.0.11/lib/umd/lossless-json.js"></script>
<script src="js/net.js"></script>
<script src="js/battle_proto.js"></script>
<script src="js/chat.js"></script>
    <script src="js/moba.js"></script>
</head>
<body>
<div id="app">
    <!-- 登录/注册面板 -->
    <div id="authPanel" class="panel">
        <h2>聊天室</h2>
        <div class="subtitle">演示</div>
        <div class="login-tabs">
            <button id="tabLogin" class="tab-btn active" onclick="switchTab('login')">登录</button>
            <button id="tabRegister" class="tab-btn" onclick="switchTab('register')">注册</button>
        </div>
        <input type="text" id="account" placeholder="账号" value="">
        <input type="password" id="password" placeholder="密码" value="">
        <button id="btnAuth" onclick="doAuth()">登录</button>
        <div id="authMsg"></div>
    </div>

    <!-- 大厅面板 -->
    <div id="lobbyPanel" class="panel hidden">
        <div class="lobby-header">
            <div class="user-info">
                <div class="avatar" id="userAvatar">U</div>
                <span id="userLabel">用户</span>
            </div>
            <div style="display:flex;gap:8px;">
                <button class="secondary" onclick="logout()">登出</button>
                <button onclick="refreshRooms()">🔄 刷新</button>
            </div>
        </div>
        <div class="lobby-toolbar">
            <input type="text" id="newRoomName" placeholder="新聊天室名称" style="max-width:260px;">
            <button onclick="createRoom()">➕ 创建</button>
        </div>
        <div class="room-table-wrap">
            <table class="room-list">
                <thead>
                    <tr><th>ID</th><th>名称</th><th>创建者</th><th>创建时间</th><th>操作</th></tr>
                </thead>
                <tbody id="roomTableBody"></tbody>
            </table>
        </div>
        <div class="lobby-moba-entry">
            <button class="moba-entry-btn" onclick="showPanel('mobaMatchPanel')">
                <span class="moba-entry-icon">⚔️</span>
                <span class="moba-entry-text">
                    <strong>竞技对战</strong>
                    <small>1v1 像素 MOBA 对战</small>
                </span>
                <span class="moba-entry-arrow">→</span>
            </button>
        </div>
        <div id="lobbyMsg"></div>
    </div>

    <!-- 房间面板 -->
    <div id="roomPanel" class="panel hidden">
        <div class="room-header">
            <div class="room-info">
                <div class="room-icon">💬</div>
                <div>
                    <div class="room-name" id="roomTitle">房间</div>
                    <div class="room-meta">实时消息</div>
                </div>
            </div>
            <div style="display:flex;gap:8px;">
                <button class="secondary" onclick="backToLobby()">← 返回</button>
                <button id="btnCloseRoom" class="danger hidden" onclick="closeRoom()">🗑 关闭</button>
            </div>
        </div>
        <div id="msgList" class="msg-list"></div>
        <div class="msg-input-area">
            <input type="text" id="msgInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMsg()">
            <button onclick="sendMsg()">发送</button>
        </div>
        <div id="roomMsg"></div>
    </div>

    <!-- MOBA 匹配面板 -->
    <div id="mobaMatchPanel" class="panel hidden">
        <div class="moba-match-bg">
            <div class="moba-match-content">
                <div class="moba-match-title">⚔️ 竞技场</div>
                <div class="moba-match-subtitle">1v1 像素 MOBA · 真人对战</div>
                <div class="moba-match-info">
                    <div class="moba-match-card">
                        <div class="moba-match-card-icon">🗡️</div>
                        <div class="moba-match-card-title">英雄对战</div>
                        <div class="moba-match-card-desc">与真人对手进行 1v1 对决</div>
                    </div>
                    <div class="moba-match-card">
                        <div class="moba-match-card-icon">🏰</div>
                        <div class="moba-match-card-title">推塔战略</div>
                        <div class="moba-match-card-desc">保护己方防御塔，突破敌方防线</div>
                    </div>
                    <div class="moba-match-card">
                        <div class="moba-match-card-icon">⚡</div>
                        <div class="moba-match-card-title">技能释放</div>
                        <div class="moba-match-card-desc">Q/W/E/R 四技能组合，主宰战场</div>
                    </div>
                </div>
                <button id="btnMobaMatch" class="moba-match-btn" onclick="startMobaMatch()">
                    <span class="moba-match-btn-text">⚔️ 开始匹配</span>
                </button>
                <button id="btnMobaCancelMatch" class="moba-match-btn moba-cancel-btn hidden" onclick="cancelMatch()">
                    <span class="moba-match-btn-text">取消匹配</span>
                </button>
                <div id="mobaMatchStatus" class="moba-match-status hidden">
                    <div class="moba-match-spinner"></div>
                    <span>正在加载战场...</span>
                </div>
                <button class="moba-match-back" onclick="backToLobbyFromMoba()">← 返回大厅</button>
            </div>
        </div>
    </div>

    <!-- MOBA 游戏面板 -->
    <div id="mobaGamePanel" class="panel hidden">
        <canvas id="mobaCanvas"></canvas>
        <div id="mobaHud" class="moba-hud">
            <div class="moba-hud-top">
                <div class="moba-minimap">
                    <canvas id="mobaMinimap" width="140" height="140"></canvas>
                </div>
                <div class="moba-timer" id="mobaTimer">00:00</div>
                <div class="moba-score">
                    <span class="moba-score-blue" id="mobaBlueKills">0</span>
                    <span class="moba-score-vs">VS</span>
                    <span class="moba-score-red" id="mobaRedKills">0</span>
                </div>
                <button class="moba-exit-btn" onclick="exitMobaGame()">✕</button>
                <button class="moba-end-battle-btn" onclick="endBattle()">结束战斗</button>
            </div>
            <div class="moba-hud-bottom">
                <div class="moba-hero-info">
                    <div class="moba-hero-portrait" id="mobaHeroPortrait"></div>
                    <div class="moba-hero-bars">
                        <div class="moba-bar moba-hp-bar">
                            <div class="moba-bar-fill" id="mobaHpFill"></div>
                            <span class="moba-bar-text" id="mobaHpText">500/500</span>
                        </div>
                        <div class="moba-bar moba-mp-bar">
                            <div class="moba-bar-fill" id="mobaMpFill"></div>
                            <span class="moba-bar-text" id="mobaMpText">100/100</span>
                        </div>
                    </div>
                    <div class="moba-hero-level" id="mobaHeroLevel">Lv.1</div>
                </div>
                <div class="moba-skills">
                    <div class="moba-skill" id="mobaSkillQ" onclick="mobaCastSkill(0)">
                        <div class="moba-skill-key">Q</div>
                        <div class="moba-skill-name">冲锋</div>
                        <div class="moba-skill-cd hidden" id="mobaCdQ"></div>
                    </div>
                    <div class="moba-skill" id="mobaSkillW" onclick="mobaCastSkill(1)">
                        <div class="moba-skill-key">W</div>
                        <div class="moba-skill-name">旋风</div>
                        <div class="moba-skill-cd hidden" id="mobaCdW"></div>
                    </div>
                    <div class="moba-skill" id="mobaSkillE" onclick="mobaCastSkill(2)">
                        <div class="moba-skill-key">E</div>
                        <div class="moba-skill-name">飞弹</div>
                        <div class="moba-skill-cd hidden" id="mobaCdE"></div>
                    </div>
                    <div class="moba-skill moba-skill-ult" id="mobaSkillR" onclick="mobaCastSkill(3)">
                        <div class="moba-skill-key">R</div>
                        <div class="moba-skill-name">陨石</div>
                        <div class="moba-skill-cd hidden" id="mobaCdR"></div>
                    </div>
                </div>
            </div>
            <div id="mobaKillFeed" class="moba-kill-feed"></div>
        </div>
        <!-- MOBA 结算弹窗 -->
        <div id="mobaResultModal" class="moba-result-modal hidden">
            <div class="moba-result-content">
                <div class="moba-result-title" id="mobaResultTitle">胜利</div>
                <div class="moba-result-stats">
                    <div class="moba-result-stat">
                        <span>击杀</span><span id="mobaResultKills">0</span>
                    </div>
                    <div class="moba-result-stat">
                        <span>死亡</span><span id="mobaResultDeaths">0</span>
                    </div>
                    <div class="moba-result-stat">
                        <span>金币</span><span id="mobaResultGold">0</span>
                    </div>
                    <div class="moba-result-stat">
                        <span>时长</span><span id="mobaResultTime">00:00</span>
                    </div>
                </div>
                <button class="moba-result-btn" onclick="exitMobaGame()">返回大厅</button>
            </div>
        </div>
    </div>

    <div class="status-bar" id="statusBar">未连接</div>
</div>

<script>
const LOGIN_HTTP = 'http://127.0.0.1:8084';

let wsClient = null;
let chatAPI = null;
let matchAPI = null;
let realtimeAPI = null;
let playerID = 0;
let playerName = '';
let token = '';
let currentRoom = null;
let authMode = 'login';
let root = null;

// 加载 protobuf descriptor
try {
    root = protobuf.Root.fromJSON(PROTO_DESCRIPTOR);
    window.root = root;           // 供 net.js / battle_proto.js 等跨脚本访问
    if (window.BattleProto) BattleProto.init(root);  // 注入战斗协议 schema
    setStatus('Protobuf 加载完成，请登录');
} catch (e) {
    setStatus('Protobuf 加载失败: ' + e.message);
}

function setStatus(text) {
    const bar = document.getElementById('statusBar');
    bar.textContent = text;
    bar.classList.toggle('connected', text.includes('已绑定') || text.includes('已连接'));
}

// 全局覆盖 Response.json()：所有 fetch 响应自动使用 lossless-json 解析，
// 超过 15 位的数字转为字符串，避免 JS Number 精度丢失
const _origResponseJson = Response.prototype.json;
Response.prototype.json = function() {
    return this.text().then(function(text) {
        return LosslessJSON.parse(text, null, function(numStr) {
            if (numStr.length > 15) {
                return numStr;
            }
            return parseFloat(numStr);
        });
    });
};

function showMsg(id, text, isError) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = isError ? 'error' : 'success';
}

function switchTab(mode) {
    authMode = mode;
    document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
    document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
    document.getElementById('btnAuth').textContent = mode === 'login' ? '登录' : '注册';
    document.getElementById('authMsg').textContent = '';
}

async function doAuth() {
    const account = document.getElementById('account').value.trim();
    const password = document.getElementById('password').value.trim();
    if (!account || !password) {
        showMsg('authMsg', '请输入账号和密码', true);
        return;
    }

    setStatus('请求中...');
    try {
        if (authMode === 'register') {
            const resp = await fetch(LOGIN_HTTP + '/api/v1/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ account, password })
            });
            const data = await resp.json();
            if (data.code !== 0) {
                throw new Error(data.msg || '注册失败');
            }
            showMsg('authMsg', '注册成功，请登录', false);
            switchTab('login');
            setStatus('未连接');
            return;
        }

        // 登录模式：先 HTTP 登录
        const resp = await fetch(LOGIN_HTTP + '/api/v1/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ account, password })
        });
        const data = await resp.json();
        if (data.code !== 0) {
            throw new Error(data.msg || '登录失败');
        }

        playerID = data.player_id || 0;
        playerName = account; // 使用账号名作为临时昵称
        token = data.token || '';
        const gatewayAddr = data.gateway_addr || '127.0.0.1:8083';
        setStatus('获取到 Gateway: ' + gatewayAddr + '，正在连接 WS...');

        // 建立 WebSocket 连接
        const wsUrl = 'ws://' + gatewayAddr;
        wsClient = new WSClient(wsUrl);
        await wsClient.connect();
        chatAPI = new ChatAPI(wsClient, root);
        matchAPI = new MatchAPI(wsClient, root);
        realtimeAPI = new RealtimeAPI(wsClient);

        setStatus('已连接 | 玩家ID: ' + playerID);
        showMsg('authMsg', '', false);

        // 发送玩家绑定请求（单设备登录）
        try {
            const BindReq = root.lookupType('protocol.PlayerBindReq');
            const bindPayload = BindReq.encode(BindReq.create({ playerId: playerID, token: token })).finish();
            const bindRes = await wsClient.call(Cmd.GW_PLAYER_BIND, bindPayload, 5000);
            const BindRes = root.lookupType('protocol.PlayerBindRes');
            const bindResult = BindRes.decode(bindRes.payload);
            if (bindResult.code !== 0) {
                throw new Error('绑定失败: ' + bindResult.msg);
            }
            setStatus('已绑定 | 玩家ID: ' + playerID);
        } catch (e) {
            setStatus('绑定失败');
            showMsg('authMsg', e.message || '绑定失败', true);
            wsClient.close();
            wsClient = null;
            return;
        }

        // 监听推送
        chatAPI.onNotify((msg) => {
            if (currentRoom && msg.msg && String(msg.msg.roomId) === String(currentRoom.roomId)) {
                // 过滤掉自己发送的消息（已经在sendMsg中显示过了）
                if (String(msg.msg.senderId) !== String(playerID)) {
                    appendMsg(msg.msg, false);
                }
            }
        });

        // 监听被踢通知（账号在其他地方登录）
        wsClient.onKick = (payload) => {
            let reason = '您的账号已在其他地方登录';
            try {
                const KickNotify = root.lookupType('protocol.PlayerKickNotify');
                const notify = KickNotify.decode(payload);
                reason = notify.reason || reason;
            } catch (e) {
                // 使用默认提示
            }
            alert('⚠️ ' + reason);
            returnToLogin(reason);
        };

        showPanel('lobbyPanel');
        document.getElementById('userLabel').textContent = account;
        document.getElementById('userAvatar').textContent = account.charAt(0).toUpperCase();
        refreshRooms();
    } catch (e) {
        setStatus('连接失败');
        showMsg('authMsg', e.message || '网络错误', true);
        if (wsClient) { wsClient.close(); wsClient = null; }
    }
}

function logout() {
    returnToLogin('');
}

function returnToLogin(message) {
    if (wsClient) wsClient.close();
    wsClient = null;
    chatAPI = null;
    matchAPI = null;
    realtimeAPI = null;
    playerID = 0;
    playerName = '';
    token = '';
    currentRoom = null;
    switchTab('login');
    showPanel('authPanel');
    showMsg('authMsg', message || '', !!message);
    setStatus('未连接');
}

function showPanel(id) {
    ['authPanel', 'lobbyPanel', 'roomPanel', 'mobaMatchPanel', 'mobaGamePanel'].forEach(pid => {
        document.getElementById(pid).classList.toggle('hidden', pid !== id);
    });
}

async function refreshRooms() {
    try {
        const res = await chatAPI.listRooms(1, 100);
        if (res.rooms) {
            res.rooms.forEach(r => {
                if (r.name && r.name.startsWith('MOBA_1V1_MATCH')) {
                    const ct = Number(r.createdAt);
                    const now = Date.now() / 1000;
                }
            });
        }
        const tbody = document.getElementById('roomTableBody');
        tbody.innerHTML = '';
        const now = Date.now() / 1000;
        if (res.rooms && res.rooms.length) {
            // 只显示最近 10 分钟内创建的 MOBA 房间，且排除自己创建的
            let mobaRooms = res.rooms.filter(r => {
                if (!r.name || !r.name.startsWith('MOBA_1V1_MATCH')) return false;
                if (String(r.creatorId) === String(playerID)) return false;
                const ct = Number(r.createdAt);
                if (!ct || (now - ct) >= 3600) return false;
                return true;
            });
            // 取最新的一个
            mobaRooms.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            const latestMobaRoom = mobaRooms.length > 0 ? mobaRooms[0] : null;

            res.rooms.forEach(r => {
                // 跳过旧的或自己的 MOBA 房间
                if (r.name && r.name.startsWith('MOBA_1V1_MATCH')) {
                    if (String(r.creatorId) === String(playerID)) return; // 自己的房间不显示
                if (!Number(r.createdAt) || (now - Number(r.createdAt)) >= 3600) return; // 超过60分钟的旧房间不显示
                    if (latestMobaRoom && String(r.roomId) !== String(latestMobaRoom.roomId)) return; // 只显示最新的
                }
                const tr = document.createElement('tr');
                const date = r.createdAt ? new Date(r.createdAt * 1000).toLocaleString() : '-';
                tr.innerHTML = `
                    <td>${r.roomId}</td>
                    <td>${escapeHtml(r.name)}</td>
                    <td>${r.creatorId}</td>
                    <td>${date}</td>
                    <td></td>
                `;
                const btn = document.createElement('button');
                if (r.name && r.name.startsWith('MOBA_1V1_MATCH')) {
                    btn.textContent = '⚔️ 加入对战';
                    btn.className = 'moba-join-btn';
                    btn.onclick = () => joinMobaBattle(r.roomId, r.name);
                } else {
                    btn.textContent = '加入';
                    btn.onclick = () => enterRoom(r.roomId, r.name);
                }
                tr.lastElementChild.appendChild(btn);
                tbody.appendChild(tr);
            });
            // 如果表格为空
            if (tbody.children.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5"><div class="room-empty">暂无聊天室，创建一个吧 🎉</div></td></tr>';
            }
        } else {
            tbody.innerHTML = '<tr><td colspan="5"><div class="room-empty">暂无聊天室，创建一个吧 🎉</div></td></tr>';
        }
    } catch (e) {
        showMsg('lobbyMsg', '获取列表失败: ' + e.message, true);
    }
}

async function createRoom() {
    const name = document.getElementById('newRoomName').value.trim();
    if (!name) return;
    try {
        const res = await chatAPI.createRoom(name, playerID);
        if (!res.result || !res.result.ok) throw new Error(res.result ? res.result.msg : '创建失败');
        document.getElementById('newRoomName').value = '';
        refreshRooms();
        enterRoom(res.room.roomId, res.room.name);
    } catch (e) {
        showMsg('lobbyMsg', '创建失败: ' + e.message, true);
    }
}

async function enterRoom(roomId, roomName) {
    try {
        const res = await chatAPI.joinRoom(roomId, playerID);
        if (!res.result || !res.result.ok) throw new Error(res.result ? res.result.msg : '加入失败');
        currentRoom = res.room;
        document.getElementById('roomTitle').textContent = '房间: ' + roomName;
        document.getElementById('btnCloseRoom').classList.toggle('hidden', currentRoom.creatorId !== playerID);
        showPanel('roomPanel');

        const msgList = document.getElementById('msgList');
        msgList.innerHTML = '';
        if (res.recentMsgs && res.recentMsgs.length) {
            res.recentMsgs.forEach(m => appendMsg(m, m.senderId === playerID));
        }
    } catch (e) {
        showMsg('lobbyMsg', '加入房间失败: ' + e.message, true);
    }
}

function backToLobby() {
    if (currentRoom) {
        chatAPI.leaveRoom(currentRoom.roomId, playerID).catch(() => {});
        currentRoom = null;
    }
    showPanel('lobbyPanel');
    refreshRooms();
}

async function sendMsg() {
    const input = document.getElementById('msgInput');
    const content = input.value.trim();
    if (!content || !currentRoom) return;
    try {
        const res = await chatAPI.sendMsg(currentRoom.roomId, playerID, content, playerName);
        if (!res.result || !res.result.ok) throw new Error(res.result ? res.result.msg : '发送失败');
        appendMsg(res.msg, true);
        input.value = '';
    } catch (e) {
        showMsg('roomMsg', '发送失败: ' + e.message, true);
    }
}

function appendMsg(msg, isMine) {
    const list = document.getElementById('msgList');
    const div = document.createElement('div');
    div.className = 'msg-item' + (isMine ? ' mine' : '');
    const time = msg.sentAt ? new Date(msg.sentAt * 1000).toLocaleTimeString() : '';
    div.innerHTML = `
        <div class="meta">${msg.senderName || msg.senderId} · ${time}</div>
        <div class="content">${escapeHtml(msg.content)}</div>
    `;
    list.appendChild(div);
    list.scrollTop = list.scrollHeight;
}

async function closeRoom() {
    if (!currentRoom || String(currentRoom.creatorId) !== String(playerID)) return;
    if (!confirm('确定要关闭此聊天室吗？')) return;
    try {
        const res = await chatAPI.closeRoom(currentRoom.roomId, playerID);
        if (!res.result || !res.result.ok) throw new Error(res.result ? res.result.msg : '关闭失败');
        currentRoom = null;
        showPanel('lobbyPanel');
        refreshRooms();
    } catch (e) {
        showMsg('roomMsg', '关闭失败: ' + e.message, true);
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ==================== MOBA 游戏相关 ====================
let mobaGame = null;
let battleRoomId = null;
let matchPollTimer = null;
let matchPollActive = false;
let activeMatchId = null;
let activeMatchInfo = null;

async function startMobaMatch() {
    if (!matchAPI) {
        showMsg('lobbyMsg', '请先登录并连接 Gateway', true);
        return;
    }
    const statusEl = document.getElementById('mobaMatchStatus');
    const btnEl = document.getElementById('btnMobaMatch');
    const cancelBtnEl = document.getElementById('btnMobaCancelMatch');
    statusEl.classList.remove('hidden');
    btnEl.classList.add('hidden');
    cancelBtnEl.classList.remove('hidden');
    statusEl.innerHTML = '<div class="moba-match-spinner"></div><span>正在寻找对手...</span>';

    matchPollActive = true;
    installMobaPacketRouter();
    try {
        const res = await matchAPI.enqueue(playerID, 1000, 3, 1);
        if (!res.result || !res.result.ok) throw new Error(res.result ? res.result.msg : '入队失败');
        if (res.roomId && Number(res.roomId) > 0) {
            onMobaMatched(res);
        } else {
            statusEl.innerHTML = '<div class="moba-match-spinner"></div><span>已进入匹配队列，等待对手...</span>';
            startMatchStatusPoll();
        }
    } catch(e) {
        matchPollActive = false;
        statusEl.innerHTML = '<span style="color:#e74c3c">匹配失败: ' + e.message + '</span>';
        btnEl.classList.remove('hidden');
        cancelBtnEl.classList.add('hidden');
    }
}

async function cancelMatch() {
    matchPollActive = false;
    if (matchPollTimer) {
        clearInterval(matchPollTimer);
        matchPollTimer = null;
    }
    if (!battleRoomId && matchAPI) {
        try { await matchAPI.cancel(playerID); } catch(e) {}
    }
    if (battleRoomId && realtimeAPI) {
        realtimeAPI.leaveRoom(battleRoomId, playerID).catch(() => {});
    }
    battleRoomId = null;
    activeMatchId = null;
    activeMatchInfo = null;
    const statusEl = document.getElementById('mobaMatchStatus');
    const btnEl = document.getElementById('btnMobaMatch');
    const cancelBtnEl = document.getElementById('btnMobaCancelMatch');
    statusEl.classList.add('hidden');
    statusEl.innerHTML = '<div class="moba-match-spinner"></div><span>正在寻找对手...</span>';
    btnEl.classList.remove('hidden');
    cancelBtnEl.classList.add('hidden');
}

function startMatchStatusPoll() {
    if (matchPollTimer) clearInterval(matchPollTimer);
    matchPollTimer = setInterval(async () => {
        if (!matchPollActive || !matchAPI) return;
        try {
            const res = await matchAPI.status(playerID);
            const waitSec = res.waitMs ? Math.floor(Number(res.waitMs) / 1000) : 0;
            const queueLen = res.queueLen || 0;
            const statusEl = document.getElementById('mobaMatchStatus');
            statusEl.innerHTML = '<div class="moba-match-spinner"></div><span>匹配中 ' + waitSec + 's · 队列 ' + queueLen + '</span>';
        } catch(e) {}
    }, 1000);
}

function onMobaMatched(matchRes) {
    if (!matchRes || !matchRes.roomId) return;
    matchPollActive = false;
    if (matchPollTimer) {
        clearInterval(matchPollTimer);
        matchPollTimer = null;
    }
    activeMatchInfo = matchRes;
    activeMatchId = matchRes.matchId;
    battleRoomId = String(matchRes.roomId);
    const statusEl = document.getElementById('mobaMatchStatus');
    const cancelBtnEl = document.getElementById('btnMobaCancelMatch');
    if (cancelBtnEl) cancelBtnEl.classList.add('hidden');
    statusEl.innerHTML = '<span style="color:#2ecc71">找到对手！正在进入战场...</span>';

    setTimeout(() => {
        showPanel('mobaGamePanel');
        const isBlue = (matchRes.teamA || []).map(String).includes(String(playerID));
        initMobaGame(true, battleRoomId, isBlue ? 'blue' : 'red');
    }, 1000);
}

function installMobaPacketRouter() {
    if (!wsClient || wsClient._mobaRouterInstalled) return;
    const handler = (pkt) => {
        if (pkt.cmdID === Cmd.MATCH_RES) {
            if (!matchPollActive && battleRoomId) return;
            try {
                const MatchRes = root.lookupType('match.MatchRes');
                const res = MatchRes.decode(pkt.payload);
                if (res.result && res.result.ok && res.roomId) onMobaMatched(res);
            } catch(e) {}
        } else if (pkt.cmdID === Cmd.RT_STATE_SYNC) {
            // 下行二进制：BattleStart/BattleEnd/StateSync 共用此 cmd，
            // payload 首字节 msg-type 区分，由 battle_proto.decodeDownstream 分发。
            try {
                const msg = BattleProto.decodeDownstream(pkt.payload);
                if (!msg) return;
                if (!mobaGame) return;
                if (msg.type === 'state') {
                    if (mobaGame.onStateSnapshot) mobaGame.onStateSnapshot(msg);
                } else if (msg.type === 'start') {
                    if (mobaGame.onBattleStart) mobaGame.onBattleStart(msg);
                } else if (msg.type === 'end') {
                    if (mobaGame.onBattleEnd) mobaGame.onBattleEnd(msg);
                }
            } catch(e) {
                console.error('decode RT_STATE_SYNC failed', e);
            }
        }
    };
    if (wsClient.addPacketHandler) {
        wsClient.addPacketHandler(handler);
    } else {
        const originalOnPacket = wsClient.onPacket;
        wsClient.onPacket = (pkt) => {
            if (originalOnPacket) originalOnPacket(pkt);
            handler(pkt);
        };
    }
    wsClient._mobaRouterInstalled = true;
}

async function enterRealtimeRoom(roomId, team) {
    const spawn = team === 'blue' ? { x: 10, y: 90 } : { x: 90, y: 10 };
    if (realtimeAPI) {
        try { await realtimeAPI.enterRoom(roomId, playerID, spawn.x, spawn.y); } catch(e) {}
    }
}

function initMobaGame(isPvP, roomId, team = 'blue') {
    // 先销毁旧实例
    if (mobaGame) {
        mobaGame.destroy();
        mobaGame = null;
    }

    const canvas = document.getElementById('mobaCanvas');
    const minimapCanvas = document.getElementById('mobaMinimap');

    // 全屏 canvas - 使用实际视口尺寸
    const w = document.documentElement.clientWidth || window.innerWidth;
    const h = document.documentElement.clientHeight || window.innerHeight;
    canvas.width = w;
    canvas.height = h;

    let networkConfig = null;
    if (isPvP && roomId) {
        networkConfig = {
            realtimeAPI: realtimeAPI,
            playerID: playerID,
            playerName: playerName,
            battleRoomId: roomId,
            isHost: team === 'blue'
        };
        installMobaPacketRouter();
        enterRealtimeRoom(roomId, team);
    }

    mobaGame = new MobaGame(canvas, minimapCanvas, (result) => {
        // 游戏结束回调
        showMobaResult(result);
    });
    mobaGame.start(team, networkConfig);
}

async function joinMobaBattle(roomId, roomName) {
    void roomId;
    void roomName;
    showPanel('mobaMatchPanel');
    document.getElementById('mobaMatchStatus').classList.remove('hidden');
    document.getElementById('mobaMatchStatus').innerHTML = '<div class="moba-match-spinner"></div><span>正在加入匹配队列...</span>';
    document.getElementById('btnMobaMatch').classList.add('hidden');
    const cancelBtnEl = document.getElementById('btnMobaCancelMatch');
    if (cancelBtnEl) cancelBtnEl.classList.remove('hidden');
    await startMobaMatch();
}

function initMobaGameAsClient(roomId) {
    if (mobaGame) { mobaGame.destroy(); mobaGame = null; }

    const canvas = document.getElementById('mobaCanvas');
    const minimapCanvas = document.getElementById('mobaMinimap');
    const w = document.documentElement.clientWidth || window.innerWidth;
    const h = document.documentElement.clientHeight || window.innerHeight;
    canvas.width = w;
    canvas.height = h;

    const networkConfig = {
        realtimeAPI: realtimeAPI,
        playerID: playerID,
        playerName: playerName,
        battleRoomId: roomId,
        isHost: false  // 非房主 = 红方
    };
    installMobaPacketRouter();
    enterRealtimeRoom(roomId, 'red');

    mobaGame = new MobaGame(canvas, minimapCanvas, (result) => {
        showMobaResult(result);
    });
    mobaGame.start('red', networkConfig);  // 红方
}

function mobaCastSkill(slot) {
    if (mobaGame) mobaGame.castSkill(slot);
}

function showMobaResult(result) {
    const modal = document.getElementById('mobaResultModal');
    const playerWon = result.winner === (mobaGame ? mobaGame.playerTeam : 'blue');
    document.getElementById('mobaResultTitle').textContent = playerWon ? '🏆 胜利！' : '💀 失败';
    document.getElementById('mobaResultTitle').className = 'moba-result-title ' + (playerWon ? 'victory' : 'defeat');
    document.getElementById('mobaResultKills').textContent = result.kills || 0;
    document.getElementById('mobaResultDeaths').textContent = result.deaths || 0;
    document.getElementById('mobaResultGold').textContent = result.gold || 0;
    document.getElementById('mobaResultTime').textContent = result.time || '00:00';
    modal.classList.remove('hidden');
}

function exitMobaGame() {
    matchPollActive = false;
    if (mobaGame) {
        mobaGame.destroy();
        mobaGame = null;
    }
    if (matchPollTimer) {
        clearInterval(matchPollTimer);
        matchPollTimer = null;
    }
    battleRoomId = null;
    activeMatchId = null;
    activeMatchInfo = null;
    document.getElementById('mobaResultModal').classList.add('hidden');
    document.getElementById('mobaMatchStatus').classList.add('hidden');
    document.getElementById('btnMobaMatch').classList.remove('hidden');
    document.getElementById('btnMobaCancelMatch').classList.add('hidden');
    document.getElementById('mobaMatchStatus').innerHTML = '<div class="moba-match-spinner"></div><span>正在寻找对手...</span>';
    showPanel('lobbyPanel');
}

function endBattle() {
    if (!mobaGame || !mobaGame.world) return;
    // 确定结果：根据当前世界状态
    const world = mobaGame.world;
    const playerHero = mobaGame.playerTeam === 'blue' ? world.blueHero : world.redHero;
    const opponentHero = mobaGame.playerTeam === 'blue' ? world.redHero : world.blueHero;
    // 如果对方英雄死亡或我方占优则算胜利，否则算失败
    let winner = mobaGame.playerTeam;
    if (playerHero && !playerHero.alive) winner = opponentHero ? opponentHero.team : 'red';
    const elapsed = world.gameTime || 0;
    const minutes = Math.floor(elapsed / 60);
    const seconds = Math.floor(elapsed % 60);
    showMobaResult({
        winner: winner,
        kills: playerHero ? playerHero.kills : 0,
        deaths: playerHero ? playerHero.deaths : 0,
        gold: playerHero ? playerHero.gold : 0,
        time: String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0')
    });
    // 销毁游戏
    mobaGame.destroy();
    mobaGame = null;
    if (matchPollTimer) {
        clearInterval(matchPollTimer);
        matchPollTimer = null;
    }
    battleRoomId = null;
    activeMatchId = null;
    activeMatchInfo = null;
    document.getElementById('btnMobaMatch').classList.remove('hidden');
    document.getElementById('btnMobaCancelMatch').classList.add('hidden');
}

function backToLobbyFromMoba() {
    showPanel('lobbyPanel');
}

// MOBA 游戏窗口大小调整
window.addEventListener('resize', () => {
    if (mobaGame) {
        const canvas = document.getElementById('mobaCanvas');
        canvas.width = document.documentElement.clientWidth || window.innerWidth;
        canvas.height = document.documentElement.clientHeight || window.innerHeight;
        mobaGame.resize(canvas.width, canvas.height);
    }
});
</script>
