<script>
const LOGIN_HTTP = 'http://127.0.0.1:8084';

let wsClient = null;
let chatAPI = null;
let playerID = 0;
let playerName = '';
let token = '';
let currentRoom = null;
let authMode = 'login';
let root = null;

// 加载 protobuf descriptor
try {
    root = protobuf.Root.fromJSON(PROTO_DESCRIPTOR);
    setStatus('Protobuf 加载完成，请登录');
} catch (e) {
    setStatus('Protobuf 加载失败: ' + e.message);
}

function setStatus(text) {
    const bar = document.getElementById('statusBar');
    bar.textContent = text;
    bar.classList.toggle('connected', text.includes('已绑定') || text.includes('已连接'));
}

// 全局覆盖 Response.json()：所有 fetch 响应自动使用 lossless-json 解析，
// 超过 15 位的数字转为字符串，避免 JS Number 精度丢失
const _origResponseJson = Response.prototype.json;
Response.prototype.json = function() {
    return this.text().then(function(text) {
        return LosslessJSON.parse(text, null, function(numStr) {
            if (numStr.length > 15) {
                return numStr;
            }
            return parseFloat(numStr);
        });
    });
};

function showMsg(id, text, isError) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = isError ? 'error' : 'success';
}

function switchTab(mode) {
    authMode = mode;
    document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
    document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
    document.getElementById('btnAuth').textContent = mode === 'login' ? '登录' : '注册';
    document.getElementById('authMsg').textContent = '';
}

async function doAuth() {
    const account = document.getElementById('account').value.trim();
    const password = document.getElementById('password').value.trim();
    if (!account || !password) {
        showMsg('authMsg', '请输入账号和密码', true);
        return;
    }

    setStatus('请求中...');
    try {
        if (authMode === 'register') {
            const resp = await fetch(LOGIN_HTTP + '/api/v1/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ account, password })
            });
            const data = await resp.json();
            if (data.code !== 0) {
                throw new Error(data.msg || '注册失败');
            }
            showMsg('authMsg', '注册成功，请登录', false);
            switchTab('login');
            setStatus('未连接');
            return;
        }

        // 登录模式：先 HTTP 登录
        const resp = await fetch(LOGIN_HTTP + '/api/v1/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ account, password })
        });
        const data = await resp.json();
        if (data.code !== 0) {
            throw new Error(data.msg || '登录失败');
        }

        playerID = data.player_id || 0;
        playerName = account; // 使用账号名作为临时昵称
        token = data.token || '';
        const gatewayAddr = data.gateway_addr || '127.0.0.1:8083';
        setStatus('获取到 Gateway: ' + gatewayAddr + '，正在连接 WS...');

        // 建立 WebSocket 连接
        const wsUrl = 'ws://' + gatewayAddr;
        wsClient = new WSClient(wsUrl);
        await wsClient.connect();
        chatAPI = new ChatAPI(wsClient, root);

        setStatus('已连接 | 玩家ID: ' + playerID);
        showMsg('authMsg', '', false);

        // 发送玩家绑定请求（单设备登录）
        try {
            const BindReq = root.lookupType('protocol.PlayerBindReq');
            const bindPayload = BindReq.encode(BindReq.create({ playerId: playerID, token: token })).finish();
            const bindRes = await wsClient.call(Cmd.GW_PLAYER_BIND, bindPayload, 5000);
            const BindRes = root.lookupType('protocol.PlayerBindRes');
            const bindResult = BindRes.decode(bindRes.payload);
            if (bindResult.code !== 0) {
                throw new Error('绑定失败: ' + bindResult.msg);
            }
            setStatus('已绑定 | 玩家ID: ' + playerID);
        } catch (e) {
            setStatus('绑定失败');
            showMsg('authMsg', e.message || '绑定失败', true);
            wsClient.close();
            wsClient = null;
            return;
        }

        // 监听推送
        chatAPI.onNotify((msg) => {
            if (currentRoom && msg.msg && String(msg.msg.roomId) === String(currentRoom.roomId)) {
                // 过滤掉自己发送的消息（已经在sendMsg中显示过了）
                if (String(msg.msg.senderId) !== String(playerID)) {
                    appendMsg(msg.msg, false);
                }
            }
        });

        // 监听被踢通知（账号在其他地方登录）
        wsClient.onKick = (payload) => {
            let reason = '您的账号已在其他地方登录';
            try {
                const KickNotify = root.lookupType('protocol.PlayerKickNotify');
                const notify = KickNotify.decode(payload);
                reason = notify.reason || reason;
            } catch (e) {
                // 使用默认提示
            }
            alert('⚠️ ' + reason);
            returnToLogin(reason);
        };

        showPanel('lobbyPanel');
        document.getElementById('userLabel').textContent = account;
        document.getElementById('userAvatar').textContent = account.charAt(0).toUpperCase();
        refreshRooms();
    } catch (e) {
        setStatus('连接失败');
        showMsg('authMsg', e.message || '网络错误', true);
        if (wsClient) { wsClient.close(); wsClient = null; }
    }
}

function logout() {
    returnToLogin('');
}

function returnToLogin(message) {
    if (wsClient) wsClient.close();
    wsClient = null;
    chatAPI = null;
    playerID = 0;
    playerName = '';
    token = '';
    currentRoom = null;
    switchTab('login');
    showPanel('authPanel');
    showMsg('authMsg', message || '', !!message);
    setStatus('未连接');
}

function showPanel(id) {
    ['authPanel', 'lobbyPanel', 'roomPanel', 'mobaMatchPanel', 'mobaGamePanel'].forEach(pid => {
        document.getElementById(pid).classList.toggle('hidden', pid !== id);
    });
}

async function refreshRooms() {
    try {
        const res = await chatAPI.listRooms(1, 100);
        if (res.rooms) {
            res.rooms.forEach(r => {
                if (r.name && r.name.startsWith('MOBA_1V1_MATCH')) {
                    const ct = Number(r.createdAt);
                    const now = Date.now() / 1000;
                }
            });
        }
        const tbody = document.getElementById('roomTableBody');
        tbody.innerHTML = '';
        const now = Date.now() / 1000;
        if (res.rooms && res.rooms.length) {
            // 只显示最近 10 分钟内创建的 MOBA 房间，且排除自己创建的
            let mobaRooms = res.rooms.filter(r => {
                if (!r.name || !r.name.startsWith('MOBA_1V1_MATCH')) return false;
                if (String(r.creatorId) === String(playerID)) return false;
                const ct = Number(r.createdAt);
                if (!ct || (now - ct) >= 3600) return false;
                return true;
            });
            // 取最新的一个
            mobaRooms.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            const latestMobaRoom = mobaRooms.length > 0 ? mobaRooms[0] : null;

            res.rooms.forEach(r => {
                // 跳过旧的或自己的 MOBA 房间
                if (r.name && r.name.startsWith('MOBA_1V1_MATCH')) {
                    if (String(r.creatorId) === String(playerID)) return; // 自己的房间不显示
                if (!Number(r.createdAt) || (now - Number(r.createdAt)) >= 3600) return; // 超过60分钟的旧房间不显示
                    if (latestMobaRoom && String(r.roomId) !== String(latestMobaRoom.roomId)) return; // 只显示最新的
                }
                const tr = document.createElement('tr');
                const date = r.createdAt ? new Date(r.createdAt * 1000).toLocaleString() : '-';
                tr.innerHTML = `
                    <td>${r.roomId}</td>
                    <td>${escapeHtml(r.name)}</td>
                    <td>${r.creatorId}</td>
                    <td>${date}</td>
                    <td></td>
                `;
                const btn = document.createElement('button');
                if (r.name && r.name.startsWith('MOBA_1V1_MATCH')) {
                    btn.textContent = '⚔️ 加入对战';
                    btn.className = 'moba-join-btn';
                    btn.onclick = () => joinMobaBattle(r.roomId, r.name);
                } else {
                    btn.textContent = '加入';
                    btn.onclick = () => enterRoom(r.roomId, r.name);
                }
                tr.lastElementChild.appendChild(btn);
                tbody.appendChild(tr);
            });
            // 如果表格为空
            if (tbody.children.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5"><div class="room-empty">暂无聊天室，创建一个吧 🎉</div></td></tr>';
            }
        } else {
            tbody.innerHTML = '<tr><td colspan="5"><div class="room-empty">暂无聊天室，创建一个吧 🎉</div></td></tr>';
        }
    } catch (e) {
        showMsg('lobbyMsg', '获取列表失败: ' + e.message, true);
    }
}

async function createRoom() {
    const name = document.getElementById('newRoomName').value.trim();
    if (!name) return;
    try {
        const res = await chatAPI.createRoom(name, playerID);
        if (!res.result || !res.result.ok) throw new Error(res.result ? res.result.msg : '创建失败');
        document.getElementById('newRoomName').value = '';
        refreshRooms();
        enterRoom(res.room.roomId, res.room.name);
    } catch (e) {
        showMsg('lobbyMsg', '创建失败: ' + e.message, true);
    }
}

async function enterRoom(roomId, roomName) {
    try {
        const res = await chatAPI.joinRoom(roomId, playerID);
        if (!res.result || !res.result.ok) throw new Error(res.result ? res.result.msg : '加入失败');
        currentRoom = res.room;
        document.getElementById('roomTitle').textContent = '房间: ' + roomName;
        document.getElementById('btnCloseRoom').classList.toggle('hidden', currentRoom.creatorId !== playerID);
        showPanel('roomPanel');

        const msgList = document.getElementById('msgList');
        msgList.innerHTML = '';
        if (res.recentMsgs && res.recentMsgs.length) {
            res.recentMsgs.forEach(m => appendMsg(m, m.senderId === playerID));
        }
    } catch (e) {
        showMsg('lobbyMsg', '加入房间失败: ' + e.message, true);
    }
}

function backToLobby() {
    if (currentRoom) {
        chatAPI.leaveRoom(currentRoom.roomId, playerID).catch(() => {});
        currentRoom = null;
    }
    showPanel('lobbyPanel');
    refreshRooms();
}

async function sendMsg() {
    const input = document.getElementById('msgInput');
    const content = input.value.trim();
    if (!content || !currentRoom) return;
    try {
        const res = await chatAPI.sendMsg(currentRoom.roomId, playerID, content, playerName);
        if (!res.result || !res.result.ok) throw new Error(res.result ? res.result.msg : '发送失败');
        appendMsg(res.msg, true);
        input.value = '';
    } catch (e) {
        showMsg('roomMsg', '发送失败: ' + e.message, true);
    }
}

function appendMsg(msg, isMine) {
    const list = document.getElementById('msgList');
    const div = document.createElement('div');
    div.className = 'msg-item' + (isMine ? ' mine' : '');
    const time = msg.sentAt ? new Date(msg.sentAt * 1000).toLocaleTimeString() : '';
    div.innerHTML = `
        <div class="meta">${msg.senderName || msg.senderId} · ${time}</div>
        <div class="content">${escapeHtml(msg.content)}</div>
    `;
    list.appendChild(div);
    list.scrollTop = list.scrollHeight;
}

async function closeRoom() {
    if (!currentRoom || String(currentRoom.creatorId) !== String(playerID)) return;
    if (!confirm('确定要关闭此聊天室吗？')) return;
    try {
        const res = await chatAPI.closeRoom(currentRoom.roomId, playerID);
        if (!res.result || !res.result.ok) throw new Error(res.result ? res.result.msg : '关闭失败');
        currentRoom = null;
        showPanel('lobbyPanel');
        refreshRooms();
    } catch (e) {
        showMsg('roomMsg', '关闭失败: ' + e.message, true);
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ==================== MOBA 游戏相关 ====================
let mobaGame = null;
let matchRoomId = null;
let battleRoomId = null;
let matchPollTimer = null;
let matchPollActive = false; // 防止 match poll 处理器在游戏中冲突

function startMobaMatch() {
    const statusEl = document.getElementById('mobaMatchStatus');
    const btnEl = document.getElementById('btnMobaMatch');
    const cancelBtnEl = document.getElementById('btnMobaCancelMatch');
    statusEl.classList.remove('hidden');
    btnEl.classList.add('hidden');
    cancelBtnEl.classList.remove('hidden');
    statusEl.innerHTML = '<div class="moba-match-spinner"></div><span>正在寻找对手...</span>';

    // 1. 创建或加入匹配房间
    joinMatchRoom();
}

function cancelMatch() {
    // 停止轮询
    matchPollActive = false;
    if (matchPollTimer) {
        clearInterval(matchPollTimer);
        matchPollTimer = null;
    }
    // 离开房间
    if (battleRoomId && chatAPI) {
        chatAPI.leaveRoom(battleRoomId, playerID).catch(() => {});
    }
    battleRoomId = null;
    matchRoomId = null;
    // 重置 UI
    const statusEl = document.getElementById('mobaMatchStatus');
    const btnEl = document.getElementById('btnMobaMatch');
    const cancelBtnEl = document.getElementById('btnMobaCancelMatch');
    statusEl.classList.add('hidden');
    statusEl.innerHTML = '<div class="moba-match-spinner"></div><span>正在寻找对手...</span>';
    btnEl.classList.remove('hidden');
    cancelBtnEl.classList.add('hidden');
}

async function joinMatchRoom() {
    const statusEl = document.getElementById('mobaMatchStatus');
    try {
        // 创建一个唯一的匹配房间
        const res = await chatAPI.createRoom('MOBA_1V1_MATCH_' + Date.now(), playerID);
        if (res.room && res.room.roomId) {
            battleRoomId = String(res.room.roomId);

            // 创建者也需要 joinRoom，这样 Gateway 才会转发房间广播消息
            try {
                const joinRes = await chatAPI.joinRoom(battleRoomId, playerID);
            } catch(e2) {
                console.warn('[MatchRoom] creator joinRoom failed (non-fatal):', e2.message);
            }

            // 我是房主（蓝方），等待对手
            statusEl.innerHTML = '<div class="moba-match-spinner"></div><span>已创建对战房间，等待对手加入...</span>';

            // 开始轮询房间列表，看是否有人加入
            startMatchPoll();
        } else {
            statusEl.innerHTML = '<span style="color:#e74c3c">创建房间失败</span>';
            document.getElementById('btnMobaMatch').classList.remove('hidden');
        }
    } catch(e) {
        statusEl.innerHTML = '<span style="color:#e74c3c">匹配失败: ' + e.message + '</span>';
        document.getElementById('btnMobaMatch').classList.remove('hidden');
    }
}

function startMatchPoll() {
    matchPollActive = true;
    // 通过 chatAPI.onNotify 监听消息来检测对手
    // 设置一个特殊的匹配消息处理器
    const originalOnPacket = chatAPI.ws.onPacket;
    chatAPI.ws.onPacket = (pkt) => {
        // 先调用原来的处理器（聊天消息）
        if (originalOnPacket) originalOnPacket(pkt);

        // 匹配完成后不再处理，避免与 battle notify 冲突
        if (!matchPollActive) return;

        // 检查是否是对战房间的消息
        if (pkt.cmdID === Cmd.CHAT_MSG_NOTIFY) {
            try {
                const NotifyType = root.lookupType('chat.ChatMsgNotify');
                const msg = NotifyType.decode(pkt.payload);
                if (String(msg.msg.roomId) === String(battleRoomId) &&
                    String(msg.msg.senderId) !== String(playerID)) {
                    // 对手加入了！
                    onOpponentFound(msg.msg.senderId, msg.msg.senderName);
                }
            } catch(e) { console.error('[MatchPoll] decode error', e); }
        }
    };

    // 同时也发送一条 "等待对手" 的消息
    chatAPI.sendMsg(battleRoomId, playerID, JSON.stringify({t:'wait', pid: playerID}), playerName).catch(()=>{});

    // 轮询房间成员（作为备选检测方式）
    matchPollTimer = setInterval(async () => {
        try {
            const history = await chatAPI.getHistory(battleRoomId, 10);
            const msgCount = history && history.msgs ? history.msgs.length : 0;
            if (msgCount > 0) {
                // 详细打印每条消息的摘要
            }
            if (history.msgs) {
                for (const m of history.msgs) {
                    const content = m.content || '';
                    if (content.startsWith('{')) {
                        try {
                            const data = JSON.parse(content);
                            if (data.t === 'join' && String(data.pid) !== String(playerID)) {
                                onOpponentFound(m.senderId, m.senderName);
                                return;
                            }
                        } catch(e) {}
                    }
                }
            }
        } catch(e) { console.error('[MatchPoll] poll error', e); }
    }, 2000);
}

function onOpponentFound(opponentId, opponentName) {
    // 停用 match poll 处理器，防止与 battle notify 冲突
    matchPollActive = false;
    if (matchPollTimer) {
        clearInterval(matchPollTimer);
        matchPollTimer = null;
    }

    const statusEl = document.getElementById('mobaMatchStatus');
    const cancelBtnEl = document.getElementById('btnMobaCancelMatch');
    if (cancelBtnEl) cancelBtnEl.classList.add('hidden');
    statusEl.innerHTML = '<span style="color:#2ecc71">找到对手: ' + (opponentName || opponentId) + '！正在进入战场...</span>';

    setTimeout(() => {
        showPanel('mobaGamePanel');
        initMobaGame(true, battleRoomId);
    }, 1000);
}

// Override chatAPI.onNotify to also handle battle messages during game
function setupBattleNotify(battleRoomId) {
    const originalOnPacket = chatAPI.ws.onPacket;
    chatAPI.ws.onPacket = (pkt) => {
        if (originalOnPacket) originalOnPacket(pkt);

        if (pkt.cmdID === Cmd.CHAT_MSG_NOTIFY) {
            try {
                const NotifyType = root.lookupType('chat.ChatMsgNotify');
                const msg = NotifyType.decode(pkt.payload);
                if (String(msg.msg.roomId) === String(battleRoomId) &&
                    String(msg.msg.senderId) !== String(playerID)) {
                    // 这是来自对手的游戏数据
                    if (mobaGame && mobaGame.networkSync) {
                        mobaGame.networkSync.handleMessage(msg.msg.content);
                    }
                }
            } catch(e) {}
        }
    };
}

function initMobaGame(isPvP, roomId) {
    // 先销毁旧实例
    if (mobaGame) {
        mobaGame.destroy();
        mobaGame = null;
    }

    const canvas = document.getElementById('mobaCanvas');
    const minimapCanvas = document.getElementById('mobaMinimap');

    // 全屏 canvas - 使用实际视口尺寸
    const w = document.documentElement.clientWidth || window.innerWidth;
    const h = document.documentElement.clientHeight || window.innerHeight;
    canvas.width = w;
    canvas.height = h;

    let networkConfig = null;
    if (isPvP && roomId) {
        networkConfig = {
            chatAPI: chatAPI,
            playerID: playerID,
            playerName: playerName,
            battleRoomId: roomId,
            isHost: true  // 房主 = 蓝方
        };
        setupBattleNotify(roomId);
    }

    mobaGame = new MobaGame(canvas, minimapCanvas, (result) => {
        // 游戏结束回调
        showMobaResult(result);
    });
    mobaGame.start('blue', networkConfig);
}

async function joinMobaBattle(roomId, roomName) {
    try {
        const joinRes = await chatAPI.joinRoom(roomId, playerID);
        battleRoomId = String(roomId);
        // Send join notification
        const sendRes = await chatAPI.sendMsg(roomId, playerID, JSON.stringify({t:'join', pid: playerID}), playerName);

        showPanel('mobaMatchPanel');
        const statusEl = document.getElementById('mobaMatchStatus');
        statusEl.classList.remove('hidden');
        document.getElementById('btnMobaMatch').classList.add('hidden');
        const cancelBtnEl = document.getElementById('btnMobaCancelMatch');
        if (cancelBtnEl) cancelBtnEl.classList.add('hidden');
        statusEl.innerHTML = '<span style="color:#2ecc71">找到对手！正在进入战场...</span>';

        setTimeout(() => {
            showPanel('mobaGamePanel');
            // 红方（非房主）
            initMobaGameAsClient(battleRoomId);
        }, 1000);
    } catch(e) {
        alert('加入对战失败: ' + e.message);
    }
}

function initMobaGameAsClient(roomId) {
    if (mobaGame) { mobaGame.destroy(); mobaGame = null; }

    const canvas = document.getElementById('mobaCanvas');
    const minimapCanvas = document.getElementById('mobaMinimap');
    const w = document.documentElement.clientWidth || window.innerWidth;
    const h = document.documentElement.clientHeight || window.innerHeight;
    canvas.width = w;
    canvas.height = h;

    const networkConfig = {
        chatAPI: chatAPI,
        playerID: playerID,
        playerName: playerName,
        battleRoomId: roomId,
        isHost: false  // 非房主 = 红方
    };
    setupBattleNotify(roomId);

    mobaGame = new MobaGame(canvas, minimapCanvas, (result) => {
        showMobaResult(result);
    });
    mobaGame.start('red', networkConfig);  // 红方
}

function mobaCastSkill(slot) {
    if (mobaGame) mobaGame.castSkill(slot);
}

function showMobaResult(result) {
    const modal = document.getElementById('mobaResultModal');
    const playerWon = result.winner === (mobaGame ? mobaGame.playerTeam : 'blue');
    document.getElementById('mobaResultTitle').textContent = playerWon ? '🏆 胜利！' : '💀 失败';
    document.getElementById('mobaResultTitle').className = 'moba-result-title ' + (playerWon ? 'victory' : 'defeat');
    document.getElementById('mobaResultKills').textContent = result.kills || 0;
    document.getElementById('mobaResultDeaths').textContent = result.deaths || 0;
    document.getElementById('mobaResultGold').textContent = result.gold || 0;
    document.getElementById('mobaResultTime').textContent = result.time || '00:00';
    modal.classList.remove('hidden');
}

function exitMobaGame() {
    matchPollActive = false;
    if (mobaGame) {
        mobaGame.destroy();
        mobaGame = null;
    }
    if (matchPollTimer) {
        clearInterval(matchPollTimer);
        matchPollTimer = null;
    }
    battleRoomId = null;
    matchRoomId = null;
    document.getElementById('mobaResultModal').classList.add('hidden');
    document.getElementById('mobaMatchStatus').classList.add('hidden');
    document.getElementById('btnMobaMatch').classList.remove('hidden');
    document.getElementById('btnMobaCancelMatch').classList.add('hidden');
    document.getElementById('mobaMatchStatus').innerHTML = '<div class="moba-match-spinner"></div><span>正在寻找对手...</span>';
    showPanel('lobbyPanel');
}

function endBattle() {
    if (!mobaGame || !mobaGame.world) return;
    // 确定结果：根据当前世界状态
    const world = mobaGame.world;
    const playerHero = mobaGame.playerTeam === 'blue' ? world.blueHero : world.redHero;
    const opponentHero = mobaGame.playerTeam === 'blue' ? world.redHero : world.blueHero;
    // 如果对方英雄死亡或我方占优则算胜利，否则算失败
    let winner = mobaGame.playerTeam;
    if (playerHero && !playerHero.alive) winner = opponentHero ? opponentHero.team : 'red';
    const elapsed = world.gameTime || 0;
    const minutes = Math.floor(elapsed / 60);
    const seconds = Math.floor(elapsed % 60);
    showMobaResult({
        winner: winner,
        kills: playerHero ? playerHero.kills : 0,
        deaths: playerHero ? playerHero.deaths : 0,
        gold: playerHero ? playerHero.gold : 0,
        time: String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0')
    });
    // 销毁游戏
    mobaGame.destroy();
    mobaGame = null;
    if (matchPollTimer) {
        clearInterval(matchPollTimer);
        matchPollTimer = null;
    }
    battleRoomId = null;
    matchRoomId = null;
    document.getElementById('btnMobaMatch').classList.remove('hidden');
    document.getElementById('btnMobaCancelMatch').classList.add('hidden');
}

function backToLobbyFromMoba() {
    showPanel('lobbyPanel');
}

// MOBA 游戏窗口大小调整
window.addEventListener('resize', () => {
    if (mobaGame) {
        const canvas = document.getElementById('mobaCanvas');
        canvas.width = document.documentElement.clientWidth || window.innerWidth;
        canvas.height = document.documentElement.clientHeight || window.innerHeight;
        mobaGame.resize(canvas.width, canvas.height);
    }
});
</script>
